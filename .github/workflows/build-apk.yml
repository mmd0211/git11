name: Build Sigma Planner APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 5 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare SigmaPlanner.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk SigmaPlanner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SigmaPlanner-APK
          path: SigmaPlanner.apk
          if-no-files-found: error
          retention-days: 30
